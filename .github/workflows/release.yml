name: release
on:
  push:
    tags:
      - v*
permissions:
  contents: write
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: mocha-desktop-windows-amd64-installer.exe
          - os: macos-latest
            asset: Mocha.dmg
          - os: ubuntu-latest
            asset: mocha-desktop-linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev pkg-config gcc
      - name: install nsis
        if: runner.os == 'Windows'
        run: choco install nsis -y
      - name: add nsis to path
        if: runner.os == 'Windows'
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"
      - name: install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: stamp version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          python3 - "$tag" <<'EOF'
          import json, sys
          tag = sys.argv[1]
          with open("wails.json") as f:
              cfg = json.load(f)
          cfg["info"]["productVersion"] = tag
          with open("wails.json", "w") as f:
              json.dump(cfg, f, indent=2)
              f.write("\n")
          EOF
          echo "VERSION=$tag" >> "$GITHUB_ENV"
      - name: build (linux)
        if: runner.os == 'Linux'
        run: wails build -tags webkit2_41 -ldflags "-X main.version=${{ env.VERSION }}"
      - name: build (windows)
        if: runner.os == 'Windows'
        run: wails build -nsis -ldflags "-X main.version=${{ env.VERSION }}"
      - name: build (macos)
        if: runner.os == 'macOS'
        run: |
          wails build -platform darwin/universal -ldflags "-X main.version=${{ env.VERSION }}"
          mv build/bin/mocha-desktop.app "build/bin/Mocha.app"
      - name: package dmg (macos)
        if: runner.os == 'macOS'
        run: |
          python3 -m pip install --break-system-packages dmgbuild
          bash build/darwin/package-dmg.sh "build/bin/Mocha.app"
      - name: stage asset
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then cp build/bin/*-installer.exe "dist/mocha-desktop-windows-amd64-installer.exe"; fi
          if [ "$RUNNER_OS" = "macOS" ]; then cp build/bin/Mocha.dmg "dist/Mocha.dmg"; fi
          if [ "$RUNNER_OS" = "Linux" ]; then cp build/bin/mocha-desktop "dist/mocha-desktop-linux-amd64"; fi
          ls dist
      - name: upload staged asset
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: download staged assets
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: write manifest and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          python3 - "$tag" <<'EOF'
          import hashlib, json, os, sys
          tag = sys.argv[1] if len(sys.argv) > 1 else os.environ["TAG"]
          base = "https://github.com/Mocha-Team/Mocha-Desktop/releases/download/v" + tag
          entries = [
              ("windows", "amd64", "mocha-desktop-windows-amd64-installer.exe"),
              ("darwin", "arm64", "Mocha.dmg"),
              ("darwin", "amd64", "Mocha.dmg"),
              ("linux", "amd64", "mocha-desktop-linux-amd64"),
          ]
          assets = []
          for goos, arch, name in entries:
              with open(os.path.join("dist", name), "rb") as f:
                  digest = hashlib.sha256(f.read()).hexdigest()
              assets.append({"os": goos, "arch": arch, "name": name, "url": base + "/" + name, "sha256": digest})
          manifest = {"version": tag, "notes": "", "assets": assets}
          with open("dist/updates.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          EOF
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "" dist/* --latest
