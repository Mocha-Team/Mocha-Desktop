name: build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: install linux deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev pkg-config gcc
      - name: create frontend dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
      - run: go vet -tags webkit2_41 ./...
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install linux deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev pkg-config gcc
      - name: install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: create frontend dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
        working-directory: ${{ github.workspace }}
      - name: generate wailsjs
        run: wails generate module -tags webkit2_41
        working-directory: ${{ github.workspace }}
      - run: npm ci
      - run: npm run build
  app:
    needs: [vet, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: mocha-desktop-windows
            artifact-path: build/bin/*.exe
          - os: macos-latest
            artifact-name: mocha-desktop-macos
            artifact-path: build/bin/Mocha.dmg
          - os: ubuntu-latest
            artifact-name: mocha-desktop-linux
            artifact-path: build/bin/mocha-desktop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev pkg-config gcc
      - name: install nsis
        if: runner.os == 'Windows'
        run: choco install nsis -y
      - name: add nsis to path
        if: runner.os == 'Windows'
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"
      - name: install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: build (linux)
        if: runner.os == 'Linux'
        run: wails build -tags webkit2_41
      - name: build (windows)
        if: runner.os == 'Windows'
        run: wails build -nsis
      - name: build (macos)
        if: runner.os == 'macOS'
        run: |
          wails build -platform darwin/universal
          mv build/bin/mocha-desktop.app "build/bin/Mocha.app"
      - name: package dmg (macos)
        if: runner.os == 'macOS'
        run: |
          python3 -m pip install --break-system-packages dmgbuild
          bash build/darwin/package-dmg.sh "build/bin/Mocha.app"
      - name: upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
